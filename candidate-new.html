<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Nueva candidatura | Brasaland</title>

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="candidates.css" />

  <!-- Mantén aquí los mismos imports de Tailwind / fuentes
       que ya utilizas en index.html -->
</head>

<body class="bg-cream text-walnut">

  <!-- HEADER -->
  <header class="sticky top-0 z-40 border-b border-walnut/10 bg-cream/95 backdrop-blur">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4 lg:px-8">

      <a href="index.html" class="font-display text-2xl font-semibold text-wine">
        Brasaland
      </a>

      <div class="flex items-center gap-4">
        <a href="candidates.html" class="nav-link">
          ← Volver al listado
        </a>
      </div>

    </div>
  </header>


  <!-- CONTENIDO -->
  <main class="min-h-screen">

    <section class="mx-auto max-w-3xl px-6 py-10 lg:px-8 lg:py-14">

      <h1 class="font-display text-4xl font-semibold text-wine sm:text-5xl">
        Nueva candidatura
      </h1>

      <p class="mt-3 text-walnut/70">
        Registra manualmente una candidatura nueva en el proceso de selección.
      </p>


      <!-- ÉXITO (oculto hasta que el POST funcione) -->
      <section id="success-state" class="candidate-state hidden">

        <div class="candidate-state-icon">✓</div>

        <h2 class="font-display text-2xl text-wine">
          Candidatura registrada
        </h2>

        <p id="success-message">
          La candidatura se ha creado correctamente.
        </p>

        <div class="mt-5 flex flex-wrap justify-center gap-3">
          <a href="candidates.html" class="btn-primary">
            Ver listado
          </a>
          <button id="add-another-button" type="button" class="candidate-secondary-button">
            Añadir otra candidatura
          </button>
        </div>

      </section>


      <!-- ERROR GENERAL DE LA API (oculto hasta que falle el POST) -->
      <section id="submit-error-state" class="candidate-state candidate-error hidden">

        <div class="candidate-state-icon">!</div>

        <h2 class="font-display text-2xl text-wine">
          No se pudo crear la candidatura
        </h2>

        <p id="submit-error-message">
          Ha ocurrido un error al consultar la API.
        </p>

        <button id="submit-retry-button" type="button" class="btn-primary mt-5">
          Intentar de nuevo
        </button>

      </section>


      <!-- FORMULARIO -->
      <form id="candidate-form" class="mt-10 grid gap-6 sm:grid-cols-2" novalidate>

        <div class="sm:col-span-2">
          <label for="full_name" class="mb-2 block text-sm font-medium text-walnut">
            Nombre completo <span aria-hidden="true">*</span>
          </label>
          <input id="full_name" name="full_name" type="text" class="candidate-input" required aria-describedby="error-full_name" />
          <p id="error-full_name" class="candidate-field-error hidden"></p>
        </div>

        <div>
          <label for="email" class="mb-2 block text-sm font-medium text-walnut">
            Email <span aria-hidden="true">*</span>
          </label>
          <input id="email" name="email" type="email" class="candidate-input" required aria-describedby="error-email" />
          <p id="error-email" class="candidate-field-error hidden"></p>
        </div>

        <div>
          <label for="phone" class="mb-2 block text-sm font-medium text-walnut">
            Teléfono <span aria-hidden="true">*</span>
          </label>
          <input id="phone" name="phone" type="tel" class="candidate-input" required aria-describedby="error-phone" />
          <p id="error-phone" class="candidate-field-error hidden"></p>
        </div>

        <div class="sm:col-span-2">
          <label for="position" class="mb-2 block text-sm font-medium text-walnut">
            Puesto <span aria-hidden="true">*</span>
          </label>
          <input id="position" name="position" type="text" class="candidate-input" required aria-describedby="error-position" />
          <p id="error-position" class="candidate-field-error hidden"></p>
        </div>

        <div>
          <label for="linkedin_url" class="mb-2 block text-sm font-medium text-walnut">
            LinkedIn
          </label>
          <input id="linkedin_url" name="linkedin_url" type="text" placeholder="linkedin.com/..." class="candidate-input" />
        </div>

        <div>
          <label for="cv_url" class="mb-2 block text-sm font-medium text-walnut">
            Enlace al CV
          </label>
          <input id="cv_url" name="cv_url" type="text" placeholder="storage.com/..." class="candidate-input" />
        </div>

        <div>
          <label for="experience_years" class="mb-2 block text-sm font-medium text-walnut">
            Años de experiencia
          </label>
          <input id="experience_years" name="experience_years" type="number" min="0" step="1" class="candidate-input" aria-describedby="error-experience_years" />
          <p id="error-experience_years" class="candidate-field-error hidden"></p>
        </div>

        <div class="sm:col-span-2 mt-2 flex flex-wrap gap-3">
          <button id="submit-button" type="submit" class="btn-primary">
            Guardar candidatura
          </button>
          <a href="candidates.html" class="candidate-secondary-button">
            Cancelar
          </a>
        </div>

      </form>

    </section>

  </main>


  <script src="candidate-new.js"></script>

</body>

</html>
