
services:
  api:
    build:
      context: .
      dockerfile: services/Dockerfile
    env_file:
      - .env.local
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app/services/api
    restart: unless-stopped
    networks:
      - app-network
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      QDRANT_URL: http://qdrant:6333
      MCP_SERVER_URL: http://mcp:8300/mcp
    depends_on:
      - redis
      - qdrant
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - app-network

  mcp:
    build:
      context: .
      dockerfile: services/Dockerfile
    env_file:
      - .env.local
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8300
      INCIDENTS_API_BASE_URL: http://api:8000
    command: ["python", "-m", "mcps.brasaland.server"]
    ports:
      - "8300:8300"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - app-network

  interfaces:
    build:
      context: .
      dockerfile: uis/Dockerfile
    env_file:
      - .env.local
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./uis/talent-pipeline-tracker:/app/talent-pipeline-tracker
      - /app/talent-pipeline-tracker/node_modules
      - /app/talent-pipeline-tracker/.next
      - ./uis/backoffice:/usr/share/nginx/html/backoffice
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - app-network

  flower:
    build:
      context: .
      dockerfile: Dockerfile.flower
    environment:
      - FLOWER_PORT=5555
      - CELERY_BROKER_URL=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - app-network
  worker:
    build:
      context: .
      dockerfile: services/Dockerfile
    env_file:
      - .env.local
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command:
      - celery
      - -A
      - services.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --events
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
volumes:
  qdrant_storage:
    driver: local
