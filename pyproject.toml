[project]
name = "proyecto-empresa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Silvia014", email = "roldansilvi@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.128.8",
    "libpass[bcrypt]>=1.9.3",
    "pydantic>=2.13.5",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "tinydb>=4.8.2",
    "uvicorn>=0.39.0",
]

[project.scripts]
seed = "proyecto_empresa.seed:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "proyecto_empresa"
module-root = "src"
